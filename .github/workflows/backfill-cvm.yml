name: Backfill CVM (fundamentos)

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/.trigger-backfill"
  schedule:
    # dia 15 de cada mês, 09:00 UTC — pega ITRs novos da temporada de balanços
    - cron: "0 9 15 * *"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install pandas requests

      - name: Rodar backfill
        run: python tools/backfill_cvm.py

      - name: Commitar resultado
        run: |
          git config user.name "encorpei-bot"
          git config user.email "actions@github.com"
          git add supabase/migrations/002_seed_fundamentos.sql tools/backfill_relatorio.md
          git add supabase/migrations/008_seed_acoes.sql 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Backfill CVM: fundamentos atualizados (automático)"
            git push
          fi
