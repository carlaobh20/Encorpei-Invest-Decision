name: Debug DRE (investigação pontual)

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/.trigger-debug"

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - run: python tools/debug_dre.py
      - run: |
          git config user.name "encorpei-bot"
          git config user.email "actions@github.com"
          git add tools/debug_dre.md
          git diff --cached --quiet || (git commit -m "Debug DRE: linhas brutas Localiza/Totvs/TIM (automático)" && git push)
