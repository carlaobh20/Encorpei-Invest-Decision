name: Coleta IPE (comunicações oficiais CVM)

# Baixa o dataset IPE da CVM (fatos relevantes, comunicados, apresentações),
# filtra o universo e commita a migração 010 + relatório. O stdout do script
# é SEMPRE commitado (tools/ipe_stdout.txt) — diagnóstico auditável.
# Disparo manual: tocar tools/.trigger-ipe e push, ou workflow_dispatch.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1-5" # 07h BRT, dias úteis
  push:
    paths:
      - "tools/.trigger-ipe"

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar e commitar (sempre)
        run: |
          pip install pandas requests
          python tools/coleta_ipe.py > tools/ipe_stdout.txt 2>&1 || echo "script falhou (ver stdout)" >> tools/ipe_stdout.txt
          git config user.name "encorpei-bot"
          git config user.email "actions@github.com"
          git add -f tools/ipe_stdout.txt
          git add tools/ipe_relatorio.md 2>/dev/null || true
          git add supabase/migrations/010_seed_comunicados.sql 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "IPE: coleta de comunicações oficiais (automático)" && git push)
